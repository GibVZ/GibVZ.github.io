<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро открытие!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://img.icons8.com/ios-filled/50/000000/hourglass.png" type="image/png">
    <!-- Для иконок можно использовать Font Awesome или другой CDN, но для простоты добавим одну иконку через CSS/изображение -->
</head>
<body>
    <div class="container">
        <header>
            <h1>Мы скоро откроемся!</h1>
        </header>
        <main>
            <p>
                Мы усердно работаем над тем, чтобы создать что-то невероятное.
                Оставайтесь с нами – скоро будет что-то интересное!
            </p>
            <div class="countdown" id="countdown">
                <div class="time-unit">
                    <span id="days">00</span>
                    <label>Дней</label>
                </div>
                <div class="time-unit">
                    <span id="hours">00</span>
                    <label>Часов</label>
                </div>
                <div class="time-unit">
                    <span id="minutes">00</span>
                    <label>Минут</label>
                </div>
                <div class="time-unit">
                    <span id="seconds">00</span>
                    <label>Секунд</label>
                </div>
            </div>
            <div class="social-links">
                <a href="#" class="social-icon">
                    <!-- Можно использовать SVG или Font Awesome -->
                    <img src="https://img.icons8.com/ios-filled/50/000000/instagram-new.png" alt="Instagram">
                </a>
                <a href="#" class="social-icon">
                    <img src="https://img.icons8.com/ios-filled/50/000000/telegram-app.png" alt="Telegram">
                </a>
                <a href="#" class="social-icon">
                    <img src="https://img.icons8.com/ios-filled/50/000000/vk-circled.png" alt="VK">
                </a>
            </div>
        </main>
        <footer>
            <p>&copy; 2023 Название Компании. Все права защищены.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
